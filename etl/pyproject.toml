[project]
name = "cbb-etl"
version = "0.1.0"
description = "ESPN college basketball ETL: sportsdataverse releases -> R2 + MotherDuck"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5,<1.6",  # MotherDuck supports up to 1.5.x (2.0 is rejected)
    "boto3>=1.34",
]

[project.scripts]
cbb-etl = "cbb_etl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "msgpack>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbb_etl"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "cbb_etl/sql"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
